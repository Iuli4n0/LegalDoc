name: CI - Build, Test & SonarQube Analysis

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build-test-sonar:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarQube blame analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install dotnet tools (SonarScanner & Coverage)
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: dotnet restore LegalDoc.sln
     
      - name: Build, Test & SonarQube Analysis (Unified Step)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== [1/4] Starting SonarScanner ==="
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.coverage.exclusions="**/*Test*/**,**/*Tests*/**,**/Migrations/**,**/Program.cs,**/obj/**,**/bin/**,LegalDoc.Frontend/Components/Pages/Login.razor,LegalDoc.Frontend/Components/Pages/Register.razor,LegalDoc.Frontend/Components/Pages/Upload.razor,**/Components/Pages/Login.razor,**/Components/Pages/Register.razor,**/Components/Pages/Upload.razor" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/wwwroot/**"

          echo "=== [2/4] Building solution ==="
          dotnet build LegalDoc.sln --no-restore --no-incremental --configuration Release

          echo "=== [3/4] Running tests with coverage ==="
          dotnet-coverage collect \
            "dotnet test LegalDoc.sln --no-build --configuration Release --verbosity normal" \
            -f xml \
            -o coverage.xml

          echo "=== [4/4] Ending SonarScanner ==="
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
